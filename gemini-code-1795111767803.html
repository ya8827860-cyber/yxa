<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبار منصة YXA</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --demo: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #243049;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .box {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    h1, h2, p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 0.9rem; }

    button {
      border: 1px solid var(--border);
      background: #1b253b;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #263452; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      width: 100%;
    }
    .primary:hover { background: var(--accent-hover); }

    .demo-btn {
      background: rgba(14, 165, 233, 0.16);
      border-color: rgba(14, 165, 233, 0.45);
      color: #7dd3fc;
      width: 100%;
      margin-bottom: 12px;
    }
    .demo-btn:hover { background: rgba(14, 165, 233, 0.25); }

    input, textarea {
      width: 100%;
      background: #0e1422;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .providers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .alert {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      display: none;
      line-height: 1.5;
    }
    .alert.ok { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.45); color: #bbf7d0; }
    .alert.warn { display: block; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.45); color: #fde68a; }
    .alert.err { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca; }

    .hidden { display: none; }

    .chat-log {
      height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #0d1320;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .msg {
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { background: #273554; align-self: flex-start; max-width: 88%; }
    .msg.ai { background: #162238; border: 1px solid #2b3f63; align-self: flex-end; max-width: 92%; }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="box">
    <div id="envNotice" class="alert"></div>
    <div id="statusBox" class="alert"></div>

    <!-- شاشة الاختبار والدخول -->
    <section id="authSection">
      <h1>منصة YXA</h1>
      <p class="muted">جرّب المنصة فوراً بوضع الاختبار أو سجل دخولك الفعلي.</p>

      <button type="button" id="quickTestBtn" class="demo-btn">
        ⚡ تجربة فورية للمنصة (بدون مفاتيح)
      </button>

      <form id="loginForm">
        <input type="email" id="emailInput" placeholder="البريد الإلكتروني" required />
        <input type="password" id="passwordInput" placeholder="كلمة المرور" required />
        <button type="submit" id="loginBtn" class="primary">تسجيل الدخول</button>
      </form>

      <div class="providers">
        <button type="button" id="googleBtn">Google</button>
        <button type="button" id="githubBtn">GitHub</button>
        <button type="button" id="appleBtn">Apple</button>
      </div>
    </section>

    <!-- شاشة العمل والتجربة -->
    <section id="appSection" class="hidden">
      <div class="row" style="margin-bottom: 12px;">
        <div>
          <h2 id="welcomeTitle" style="margin:0;">مرحباً بك</h2>
          <span id="sessionMode" class="muted"></span>
        </div>
        <button type="button" id="exitBtn">خروج</button>
      </div>

      <div id="chatLog" class="chat-log">
        <div class="msg ai">جاهز للاختبار! اكتب أي رسالة هنا لتجربة الرد الفوري.</div>
      </div>

      <form id="chatForm">
        <textarea id="msgInput" rows="2" placeholder="اكتب رسالتك لاختبار المنصة..." required></textarea>
        <button type="submit" id="sendBtn" class="primary">إرسال</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      GoogleAuthProvider,
      GithubAuthProvider,
      OAuthProvider,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // ضع بياناتك الحقيقية هنا عند الربط الفعلي
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";
    const GEMINI_MODEL = "gemini-2.5-flash";

    const hasRealFirebase = !firebaseConfig.apiKey.startsWith("YOUR_");
    const hasRealGemini = !GEMINI_API_KEY.startsWith("YOUR_");

    let auth = null;
    if (hasRealFirebase) {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    }

    const envNotice = document.getElementById("envNotice");
    const statusBox = document.getElementById("statusBox");
    const authSection = document.getElementById("authSection");
    const appSection = document.getElementById("appSection");
    const quickTestBtn = document.getElementById("quickTestBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const googleBtn = document.getElementById("googleBtn");
    const githubBtn = document.getElementById("githubBtn");
    const appleBtn = document.getElementById("appleBtn");
    const exitBtn = document.getElementById("exitBtn");
    const welcomeTitle = document.getElementById("welcomeTitle");
    const sessionMode = document.getElementById("sessionMode");
    const chatLog = document.getElementById("chatLog");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    let isDemoSession = false;
    let activeController = null;
    const chatHistory = [];

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
    const isLocalFile = window.location.protocol === "file:" || window.location.protocol === "content:";

    if (isLocalFile) {
      envNotice.className = "alert warn";
      envNotice.textContent = "ملاحظة: أنت تفتح الملف محلياً. وضع التجربة الفورية شغال فوراً، بينما دخول Google/GitHub/Apple الفعلي يحتاج رابط http أو https مضاف في Firebase.";
    }

    function showStatus(type, text) {
      statusBox.className = `alert ${type}`;
      statusBox.textContent = text;
    }

    function enterApp(title, modeText, demo = false) {
      isDemoSession = demo;
      welcomeTitle.textContent = title;
      sessionMode.textContent = modeText;
      authSection.classList.add("hidden");
      appSection.classList.remove("hidden");
    }

    function leaveApp() {
      if (activeController) activeController.abort();
      isDemoSession = false;
      appSection.classList.add("hidden");
      authSection.classList.remove("hidden");
    }

    // زر تجربة فورية لاختبار الواجهة والمحادثة مباشرة
    quickTestBtn.addEventListener("click", () => {
      showStatus("ok", "تم تفعيل وضع الاختبار الفوري بنجاح.");
      enterApp("مرحباً في وضع التجربة", "اختبار محلي سريع • بدون مفاتيح", true);
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!hasRealFirebase || !auth) {
        showStatus("warn", "مفاتيح Firebase غير مضافة بعد. اضغط (تجربة فورية للمنصة) للاختبار الآن.");
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        showStatus("ok", "تم تسجيل الدخول بنجاح.");
      } catch (err) {
        showStatus("err", `تعذر الدخول: ${err.code || err.message}`);
      }
    });

    async function handleOAuth(provider) {
      if (!hasRealFirebase || !auth) {
        showStatus("warn", "أضف مفاتيح Firebase أولاً، أو استخدم زر التجربة الفورية.");
        return;
      }
      if (isLocalFile) {
        showStatus("warn", "افتح المنصة من رابط http/https وليس كملف محلي.");
        return;
      }
      try {
        if (isMobile) {
          await signInWithRedirect(auth, provider);
        } else {
          await signInWithPopup(auth, provider);
        }
      } catch (err) {
        if (err?.code === "auth/cancelled-popup-request" || err?.code === "auth/popup-blocked") {
          await signInWithRedirect(auth, provider);
        } else {
          showStatus("err", `خطأ في المزود: ${err.code || err.message}`);
        }
      }
    }

    googleBtn.addEventListener("click", () => handleOAuth(new GoogleAuthProvider()));
    githubBtn.addEventListener("click", () => handleOAuth(new GithubAuthProvider()));
    appleBtn.addEventListener("click", () => handleOAuth(new OAuthProvider("apple.com")));

    exitBtn.addEventListener("click", async () => {
      if (auth && !isDemoSession) {
        await signOut(auth);
      }
      leaveApp();
      showStatus("ok", "تم الخروج من جلسة الاختبار.");
    });

    if (auth) {
      getRedirectResult(auth).catch(() => {});
      onAuthStateChanged(auth, (user) => {
        if (user) {
          enterApp(`مرحباً ${user.displayName || "بك في YXA"}`, user.email || "حساب Firebase", false);
        } else if (!isDemoSession) {
          leaveApp();
        }
      });
    }

    function appendBubble(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatLog.appendChild(div);
      requestAnimationFrame(() => {
        chatLog.scrollTop = chatLog.scrollHeight;
      });
      return div;
    }

    async function getAiResponse(text) {
      if (!hasRealGemini || isDemoSession) {
        return `رد اختباري من منصة YXA: استلمت رسالتك "${text}" والواجهة تعمل بسلاسة. وعند إضافة مفتاح Gemini الحقيقي ستحصل على ردود ذكاء اصطناعي مباشرة.`;
      }

      if (activeController) activeController.abort();
      activeController = new AbortController();
      const timer = setTimeout(() => activeController.abort(), 20000);

      chatHistory.push({ role: "user", parts: [{ text }] });
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: activeController.signal,
        body: JSON.stringify({
          contents: chatHistory.slice(-12),
          generationConfig: { temperature: 0.6, maxOutputTokens: 1024 }
        })
      });

      clearTimeout(timer);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "لم يرد النموذج.";
      chatHistory.push({ role: "model", parts: [{ text: reply }] });
      return reply;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;

      msgInput.value = "";
      sendBtn.disabled = true;
      appendBubble("user", text);
      const replyBubble = appendBubble("ai", "جاري المعالجة...");

      try {
        replyBubble.textContent = await getAiResponse(text);
      } catch (err) {
        replyBubble.textContent = err?.name === "AbortError"
          ? "انتهت مهلة الطلب أو تم استبداله."
          : `تعذر إتمام الطلب: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        requestAnimationFrame(() => {
          chatLog.scrollTop = chatLog.scrollHeight;
        });
      }
    });
  </script>
</body>
</html>

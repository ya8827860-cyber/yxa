<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ط§ط®طھط¨ط§ط± ظ…ظ†طµط© YXA</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --demo: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #243049;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .box {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    h1, h2, p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 0.9rem; }

    button {
      border: 1px solid var(--border);
      background: #1b253b;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #263452; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      width: 100%;
    }
    .primary:hover { background: var(--accent-hover); }

    .demo-btn {
      background: rgba(14, 165, 233, 0.16);
      border-color: rgba(14, 165, 233, 0.45);
      color: #7dd3fc;
      width: 100%;
      margin-bottom: 12px;
    }
    .demo-btn:hover { background: rgba(14, 165, 233, 0.25); }

    input, textarea {
      width: 100%;
      background: #0e1422;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .providers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .alert {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      display: none;
      line-height: 1.5;
    }
    .alert.ok { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.45); color: #bbf7d0; }
    .alert.warn { display: block; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.45); color: #fde68a; }
    .alert.err { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca; }

    .hidden { display: none; }

    .chat-log {
      height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #0d1320;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .msg {
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { background: #273554; align-self: flex-start; max-width: 88%; }
    .msg.ai { background: #162238; border: 1px solid #2b3f63; align-self: flex-end; max-width: 92%; }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="box">
    <div id="envNotice" class="alert"></div>
    <div id="statusBox" class="alert"></div>

    <!-- ط´ط§ط´ط© ط§ظ„ط§ط®طھط¨ط§ط± ظˆط§ظ„ط¯ط®ظˆظ„ -->
    <section id="authSection">
      <h1>ظ…ظ†طµط© YXA</h1>
      <p class="muted">ط¬ط±ظ‘ط¨ ط§ظ„ظ…ظ†طµط© ظپظˆط±ط§ظ‹ ط¨ظˆط¶ط¹ ط§ظ„ط§ط®طھط¨ط§ط± ط£ظˆ ط³ط¬ظ„ ط¯ط®ظˆظ„ظƒ ط§ظ„ظپط¹ظ„ظٹ.</p>

      <button type="button" id="quickTestBtn" class="demo-btn">
        âڑ، طھط¬ط±ط¨ط© ظپظˆط±ظٹط© ظ„ظ„ظ…ظ†طµط© (ط¨ط¯ظˆظ† ظ…ظپط§طھظٹط­)
      </button>

      <form id="loginForm">
        <input type="email" id="emailInput" placeholder="ط§ظ„ط¨ط±ظٹط¯ ط§ظ„ط¥ظ„ظƒطھط±ظˆظ†ظٹ" required />
        <input type="password" id="passwordInput" placeholder="ظƒظ„ظ…ط© ط§ظ„ظ…ط±ظˆط±" required />
        <button type="submit" id="loginBtn" class="primary">طھط³ط¬ظٹظ„ ط§ظ„ط¯ط®ظˆظ„</button>
      </form>

      <div class="providers">
        <button type="button" id="googleBtn">Google</button>
        <button type="button" id="githubBtn">GitHub</button>
        <button type="button" id="appleBtn">Apple</button>
      </div>
    </section>

    <!-- ط´ط§ط´ط© ط§ظ„ط¹ظ…ظ„ ظˆط§ظ„طھط¬ط±ط¨ط© -->
    <section id="appSection" class="hidden">
      <div class="row" style="margin-bottom: 12px;">
        <div>
          <h2 id="welcomeTitle" style="margin:0;">ظ…ط±ط­ط¨ط§ظ‹ ط¨ظƒ</h2>
          <span id="sessionMode" class="muted"></span>
        </div>
        <button type="button" id="exitBtn">ط®ط±ظˆط¬</button>
      </div>

      <div id="chatLog" class="chat-log">
        <div class="msg ai">ط¬ط§ظ‡ط² ظ„ظ„ط§ط®طھط¨ط§ط±! ط§ظƒطھط¨ ط£ظٹ ط±ط³ط§ظ„ط© ظ‡ظ†ط§ ظ„طھط¬ط±ط¨ط© ط§ظ„ط±ط¯ ط§ظ„ظپظˆط±ظٹ.</div>
      </div>

      <form id="chatForm">
        <textarea id="msgInput" rows="2" placeholder="ط§ظƒطھط¨ ط±ط³ط§ظ„طھظƒ ظ„ط§ط®طھط¨ط§ط± ط§ظ„ظ…ظ†طµط©..." required></textarea>
        <button type="submit" id="sendBtn" class="primary">ط¥ط±ط³ط§ظ„</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      GoogleAuthProvider,
      GithubAuthProvider,
      OAuthProvider,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // ط¶ط¹ ط¨ظٹط§ظ†ط§طھظƒ ط§ظ„ط­ظ‚ظٹظ‚ظٹط© ظ‡ظ†ط§ ط¹ظ†ط¯ ط§ظ„ط±ط¨ط· ط§ظ„ظپط¹ظ„ظٹ
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";
    const GEMINI_MODEL = "gemini-2.5-flash";

    const hasRealFirebase = !firebaseConfig.apiKey.startsWith("YOUR_");
    const hasRealGemini = !GEMINI_API_KEY.startsWith("YOUR_");

    let auth = null;
    if (hasRealFirebase) {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    }

    const envNotice = document.getElementById("envNotice");
    const statusBox = document.getElementById("statusBox");
    const authSection = document.getElementById("authSection");
    const appSection = document.getElementById("appSection");
    const quickTestBtn = document.getElementById("quickTestBtn");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const googleBtn = document.getElementById("googleBtn");
    const githubBtn = document.getElementById("githubBtn");
    const appleBtn = document.getElementById("appleBtn");
    const exitBtn = document.getElementById("exitBtn");
    const welcomeTitle = document.getElementById("welcomeTitle");
    const sessionMode = document.getElementById("sessionMode");
    const chatLog = document.getElementById("chatLog");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    let isDemoSession = false;
    let activeController = null;
    const chatHistory = [];

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
    const isLocalFile = window.location.protocol === "file:" || window.location.protocol === "content:";

    if (isLocalFile) {
      envNotice.className = "alert warn";
      envNotice.textContent = "ظ…ظ„ط§ط­ط¸ط©: ط£ظ†طھ طھظپطھط­ ط§ظ„ظ…ظ„ظپ ظ…ط­ظ„ظٹط§ظ‹. ظˆط¶ط¹ ط§ظ„طھط¬ط±ط¨ط© ط§ظ„ظپظˆط±ظٹط© ط´ط؛ط§ظ„ ظپظˆط±ط§ظ‹طŒ ط¨ظٹظ†ظ…ط§ ط¯ط®ظˆظ„ Google/GitHub/Apple ط§ظ„ظپط¹ظ„ظٹ ظٹط­طھط§ط¬ ط±ط§ط¨ط· http ط£ظˆ https ظ…ط¶ط§ظپ ظپظٹ Firebase.";
    }

    function showStatus(type, text) {
      statusBox.className = `alert ${type}`;
      statusBox.textContent = text;
    }

    function enterApp(title, modeText, demo = false) {
      isDemoSession = demo;
      welcomeTitle.textContent = title;
      sessionMode.textContent = modeText;
      authSection.classList.add("hidden");
      appSection.classList.remove("hidden");
    }

    function leaveApp() {
      if (activeController) activeController.abort();
      isDemoSession = false;
      appSection.classList.add("hidden");
      authSection.classList.remove("hidden");
    }

    // ط²ط± طھط¬ط±ط¨ط© ظپظˆط±ظٹط© ظ„ط§ط®طھط¨ط§ط± ط§ظ„ظˆط§ط¬ظ‡ط© ظˆط§ظ„ظ…ط­ط§ط¯ط«ط© ظ…ط¨ط§ط´ط±ط©
    quickTestBtn.addEventListener("click", () => {
      showStatus("ok", "طھظ… طھظپط¹ظٹظ„ ظˆط¶ط¹ ط§ظ„ط§ط®طھط¨ط§ط± ط§ظ„ظپظˆط±ظٹ ط¨ظ†ط¬ط§ط­.");
      enterApp("ظ…ط±ط­ط¨ط§ظ‹ ظپظٹ ظˆط¶ط¹ ط§ظ„طھط¬ط±ط¨ط©", "ط§ط®طھط¨ط§ط± ظ…ط­ظ„ظٹ ط³ط±ظٹط¹ â€¢ ط¨ط¯ظˆظ† ظ…ظپط§طھظٹط­", true);
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!hasRealFirebase || !auth) {
        showStatus("warn", "ظ…ظپط§طھظٹط­ Firebase ط؛ظٹط± ظ…ط¶ط§ظپط© ط¨ط¹ط¯. ط§ط¶ط؛ط· (طھط¬ط±ط¨ط© ظپظˆط±ظٹط© ظ„ظ„ظ…ظ†طµط©) ظ„ظ„ط§ط®طھط¨ط§ط± ط§ظ„ط¢ظ†.");
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        showStatus("ok", "طھظ… طھط³ط¬ظٹظ„ ط§ظ„ط¯ط®ظˆظ„ ط¨ظ†ط¬ط§ط­.");
      } catch (err) {
        showStatus("err", `طھط¹ط°ط± ط§ظ„ط¯ط®ظˆظ„: ${err.code || err.message}`);
      }
    });

    async function handleOAuth(provider) {
      if (!hasRealFirebase || !auth) {
        showStatus("warn", "ط£ط¶ظپ ظ…ظپط§طھظٹط­ Firebase ط£ظˆظ„ط§ظ‹طŒ ط£ظˆ ط§ط³طھط®ط¯ظ… ط²ط± ط§ظ„طھط¬ط±ط¨ط© ط§ظ„ظپظˆط±ظٹط©.");
        return;
      }
      if (isLocalFile) {
        showStatus("warn", "ط§ظپطھط­ ط§ظ„ظ…ظ†طµط© ظ…ظ† ط±ط§ط¨ط· http/https ظˆظ„ظٹط³ ظƒظ…ظ„ظپ ظ…ط­ظ„ظٹ.");
        return;
      }
      try {
        if (isMobile) {
          await signInWithRedirect(auth, provider);
        } else {
          await signInWithPopup(auth, provider);
        }
      } catch (err) {
        if (err?.code === "auth/cancelled-popup-request" || err?.code === "auth/popup-blocked") {
          await signInWithRedirect(auth, provider);
        } else {
          showStatus("err", `ط®ط·ط£ ظپظٹ ط§ظ„ظ…ط²ظˆط¯: ${err.code || err.message}`);
        }
      }
    }

    googleBtn.addEventListener("click", () => handleOAuth(new GoogleAuthProvider()));
    githubBtn.addEventListener("click", () => handleOAuth(new GithubAuthProvider()));
    appleBtn.addEventListener("click", () => handleOAuth(new OAuthProvider("apple.com")));

    exitBtn.addEventListener("click", async () => {
      if (auth && !isDemoSession) {
        await signOut(auth);
      }
      leaveApp();
      showStatus("ok", "طھظ… ط§ظ„ط®ط±ظˆط¬ ظ…ظ† ط¬ظ„ط³ط© ط§ظ„ط§ط®طھط¨ط§ط±.");
    });

    if (auth) {
      getRedirectResult(auth).catch(() => {});
      onAuthStateChanged(auth, (user) => {
        if (user) {
          enterApp(`ظ…ط±ط­ط¨ط§ظ‹ ${user.displayName || "ط¨ظƒ ظپظٹ YXA"}`, user.email || "ط­ط³ط§ط¨ Firebase", false);
        } else if (!isDemoSession) {
          leaveApp();
        }
      });
    }

    function appendBubble(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatLog.appendChild(div);
      requestAnimationFrame(() => {
        chatLog.scrollTop = chatLog.scrollHeight;
      });
      return div;
    }

    async function getAiResponse(text) {
      if (!hasRealGemini || isDemoSession) {
        return `ط±ط¯ ط§ط®طھط¨ط§ط±ظٹ ظ…ظ† ظ…ظ†طµط© YXA: ط§ط³طھظ„ظ…طھ ط±ط³ط§ظ„طھظƒ "${text}" ظˆط§ظ„ظˆط§ط¬ظ‡ط© طھط¹ظ…ظ„ ط¨ط³ظ„ط§ط³ط©. ظˆط¹ظ†ط¯ ط¥ط¶ط§ظپط© ظ…ظپطھط§ط­ Gemini ط§ظ„ط­ظ‚ظٹظ‚ظٹ ط³طھط­طµظ„ ط¹ظ„ظ‰ ط±ط¯ظˆط¯ ط°ظƒط§ط، ط§طµط·ظ†ط§ط¹ظٹ ظ…ط¨ط§ط´ط±ط©.`;
      }

      if (activeController) activeController.abort();
      activeController = new AbortController();
      const timer = setTimeout(() => activeController.abort(), 20000);

      chatHistory.push({ role: "user", parts: [{ text }] });
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: activeController.signal,
        body: JSON.stringify({
          contents: chatHistory.slice(-12),
          generationConfig: { temperature: 0.6, maxOutputTokens: 1024 }
        })
      });

      clearTimeout(timer);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "ظ„ظ… ظٹط±ط¯ ط§ظ„ظ†ظ…ظˆط°ط¬.";
      chatHistory.push({ role: "model", parts: [{ text: reply }] });
      return reply;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;

      msgInput.value = "";
      sendBtn.disabled = true;
      appendBubble("user", text);
      const replyBubble = appendBubble("ai", "ط¬ط§ط±ظٹ ط§ظ„ظ…ط¹ط§ظ„ط¬ط©...");

      try {
        replyBubble.textContent = await getAiResponse(text);
      } catch (err) {
        replyBubble.textContent = err?.name === "AbortError"
          ? "ط§ظ†طھظ‡طھ ظ…ظ‡ظ„ط© ط§ظ„ط·ظ„ط¨ ط£ظˆ طھظ… ط§ط³طھط¨ط¯ط§ظ„ظ‡."
          : `طھط¹ط°ط± ط¥طھظ…ط§ظ… ط§ظ„ط·ظ„ط¨: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        requestAnimationFrame(() => {
          chatLog.scrollTop = chatLog.scrollHeight;
        });
      }
    });
  </script>
</body>

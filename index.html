<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">

<title>تواصل | YXA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode:'class', theme:{ extend:{ fontFamily:{ sans:['Cairo','Inter','sans-serif'] } } } };
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{font-family:'Cairo',sans-serif;box-sizing:border-box}
  .btn-act{transition:transform .14s cubic-bezier(.16,1,.3,1),opacity .2s}
  .btn-act:hover{transform:translateY(-1px)}
  .btn-act:active{transform:scale(.95)}
  .btn-act:disabled{opacity:.5;cursor:not-allowed;transform:none}
  @keyframes spring{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  .anim-spring{animation:spring .28s cubic-bezier(.16,1,.3,1) both}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading::after{content:'';display:inline-block;width:12px;height:12px;margin-inline-start:6px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-thumb{background:#525252;border-radius:9999px}
  .msg-me{background:#000;color:#fff;margin-inline-start:auto;max-width:80%;padding:8px 12px;border-radius:16px;font-size:12px;font-weight:700;word-wrap:break-word}
  .dark .msg-me{background:#fff;color:#000}
  .msg-other{background:#f5f5f5;color:#000;margin-inline-end:auto;max-width:80%;padding:8px 12px;border-radius:16px;font-size:12px;word-wrap:break-word}
  .dark .msg-other{background:#171717;color:#fff;border:1px solid #262626}
</style>
</head>
<body class="bg-neutral-100 text-neutral-950 dark:bg-black dark:text-neutral-50 min-h-screen flex flex-col antialiased">

<!-- ============ TOAST ============ -->
<div id="toast-container" class="fixed top-4 left-4 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

<!-- ============ BOOT ============ -->

  <p class="text-xs font-bold text-neutral-500">جاري التحميل...</p>
</div>

<!-- ============ AUTH ============ -->

  <div class="w-full max-w-md bg-white dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-800 rounded-3xl p-6 shadow-2xl anim-spring space-y-5 my-4">

    </div>

    <div class="grid grid-cols-2 gap-1 p-1 bg-neutral-100 dark:bg-neutral-900 rounded-2xl text-xs font-bold">

      <button type="button" id="tab-register" onclick="switchAuthTab('register')" class="btn-act py-2.5 rounded-xl text-neutral-500">حساب جديد</button>

        <input type="email" id="login-email" required autocomplete="email" placeholder="you@yxa.app" class="w-full bg-neutral-50 dark:bg-black border border-neutral-300 dark:border-neutral-800 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-black dark:focus:border-white">
      </div>

      <button type="submit" id="btn-login" class="btn-act w-full py-3.5 rounded-2xl bg-black dark:bg-white text-white dark:text-black font-black text-xs">دخول</button>

    <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3 hidden">

<!-- ============ SCRIPT ============ -->
<script type="module">
/* ============================================================
   1) إعدادات Firebase — استبدل القيم بمشروعك
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

/* ============================================================
   2) Imports من CDN
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail,
  GoogleAuthProvider, signInWithPopup, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc,
  query, where, orderBy, onSnapshot, serverTimestamp, deleteDoc,
  getDocs, limit, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ============================================================
   3) Init
   ============================================================ */
const app     = initializeApp(firebaseConfig);
const auth    = getAuth(app);
const db      = getFirestore(app);
const storage = getStorage(app);

/* ============================================================
   4) Helpers
   ============================================================ */
const $   = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uidShort = () => 'YXA-' + Math.floor(1000 + Math.random()*9000);

function toast(msg, type='success') {
  const el = document.createElement('div');
  const bg = type==='error' ? 'bg-rose-600' : type==='info' ? 'bg-neutral-700' : 'bg-black dark:bg-white dark:text-black';
  el.className = `${bg} text-white px-4 py-2.5 rounded-2xl text-xs font-bold anim-spring pointer-events-auto flex items-center gap-2 shadow-xl`;
  el.innerHTML = `<i class="fa-solid ${type==='error'?'fa-circle-exclamation':'fa-check-circle'}"></i> ${esc(msg)}`;
  $('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function busy(btn, on) {
  if (!btn) return;
  if (on) { btn.dataset.t = btn.innerHTML; btn.classList.add('loading'); btn.disabled = true; }
  else    { if (btn.dataset.t) btn.innerHTML = btn.dataset.t; btn.classList.remove('loading'); btn.disabled = false; }
}

/* ============================================================
   5) Theme
   ============================================================ */
function applyTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  localStorage.setItem('yxa_theme', t);
}
window.toggleTheme = () => applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
applyTheme(localStorage.getItem('yxa_theme') || 'dark');

/* ============================================================
   6) State
   ============================================================ */
let me = null;
let unsubs = [];
let currentChat = null;
let chatUnsub = null;
let aiBusy = false;

/* ============================================================
   7) Auth UI
   ============================================================ */
window.switchAuthTab = (tab) => {
  $('form-login').classList.toggle('hidden', tab !== 'login');
  $('form-register').classList.toggle('hidden', tab !== 'register');
  $('tab-login').className = tab==='login' ? 'btn-act py-2.5 rounded-xl bg-white dark:bg-black shadow font-black' : 'btn-act py-2.5 rounded-xl text-neutral-500';
  $('tab-register').className = tab==='register' ? 'btn-act py-2.5 rounded-xl bg-white dark:bg-black shadow font-black' : 'btn-act py-2.5 rounded-xl text-neutral-500';
};

window.handleRegister = async (e) => {
  e.preventDefault();
  const btn = $('btn-register');
  const name = $('reg-name').value.trim();
  const email = $('reg-email').value.trim();
  const phone = $('reg-phone').value.trim();
  const pass = $('reg-pass').value;

  if (name.length < 2) { toast('الاسم قصير جداً', 'error'); return; }
  if (!/^0?5\d{8}$/.test(phone)) { toast('رقم جوال غير صالح', 'error'); return; }
  if (pass.length < 6) { toast('كلمة المرور 6+ أحرف', 'error'); return; }

  busy(btn, true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    const profile = {
      name, email, phone,
      yxaId: uidShort(),
      photoURL: '',
      bio: '',
      createdAt: serverTimestamp()
    };
    await setDoc(doc(db, 'users', cred.user.uid), profile);
    toast('تم إنشاء الحساب');
  } catch (err) {
    toast(translateAuthError(err.code), 'error');
  } finally {
    busy(btn, false);
  }
};

window.handleLogin = async (e) => {
  e.preventDefault();
  const btn = $('btn-login');
  const email = $('login-email').value.trim();
  const pass  = $('login-pass').value;
  busy(btn, true);
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    toast('تم الدخول بنجاح');
  } catch (err) {
    toast(translateAuthError(err.code), 'error');
  } finally {
    busy(btn, false);
  }
};

window.sendPasswordReset = async () => {
  const email = $('login-email').value.trim();
  if (!email) { toast('أدخل بريدك أولاً', 'error'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    toast('تم إرسال رابط إعادة التعيين', 'info');
  } catch (err) {
    toast(translateAuthError(err.code), 'error');
  }
};

window.loginWithGoogle = async () => {
  try {
    const provider = new GoogleAuthProvider();
    const cred = await signInWithPopup(auth, provider);
    // إذا لم يكن له ملف، أنشئه
    const snap = await getDoc(doc(db, 'users', cred.user.uid));
    if (!snap.exists()) {
      await setDoc(doc(db, 'users', cred.user.uid), {
        name: cred.user.displayName || 'مستخدم Google',
        email: cred.user.email,
        phone: '',
        yxaId: uidShort(),
        photoURL: cred.user.photoURL || '',
        bio: '',
        createdAt: serverTimestamp()
      });
    }
    toast('تم الدخول بـ Google');
  } catch (err) {
    toast(translateAuthError(err.code), 'error');
  }
};

window.logout = async () => {
  try {
    await signOut(auth);
    toast('تم تسجيل الخروج', 'info');
  } catch (_) {}
};

function translateAuthError(code) {
  const map = {
    'auth/email-already-in-use': 'البريد مستخدم بالفعل',
    'auth/invalid-email': 'بريد غير صالح',
    'auth/weak-password': 'كلمة المرور ضعيفة',
    'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
    'auth/wrong-password': 'كلمة المرور خاطئة',
    'auth/invalid-credential': 'بيانات الدخول غير صحيحة',
    'auth/too-many-requests': 'محاولات كثيرة، حاول لاحقاً',
    'auth/popup-closed-by-user': 'أُغلقت نافذة Google',
    'auth/network-request-failed': 'تعذر الاتصال بالشبكة',
    'auth/operation-not-allowed': 'طريقة الدخول غير مفعّلة في Firebase'
  };
  return map[code] || 'حدث خطأ: ' + code;
}

/* ============================================================
   8) Auth State → App
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  // إيقاف المستمعات السابقة
  unsubs.forEach(u => { try { u(); } catch(_){} });
  unsubs = [];
  if (chatUnsub) { try { chatUnsub(); } catch(_){} chatUnsub = null; }

  $('boot-screen').classList.add('hidden');

  if (!user) {
    me = null;
    $('auth-screen').classList.remove('hidden');
    $('app').classList.add('hidden');
    return;
  }

  // تحميل الملف الشخصي
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) {
    // حالة Google جديد لم يُنشأ بعد (نادراً)
    await setDoc(doc(db, 'users', user.uid), {
      name: user.displayName || 'مستخدم',
      email: user.email,
      phone: '',
      yxaId: uidShort(),
      photoURL: user.photoURL || '',
      bio: '',
      createdAt: serverTimestamp()
    });
  }
  me = { uid: user.uid, ...(await getDoc(doc(db, 'users', user.uid))).data() };

  $('auth-screen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('badge-yxa').textContent = me.yxaId;
  $('badge-name').textContent = me.name;
  $('acc-name').value = me.name || '';
  $('acc-phone').value = me.phone || '';
  $('acc-email').value = me.email || '';

  openTab('feed');
  startFeed();
  startConversations();
  startFiles();
});

/* ============================================================
   9) Tabs
   ============================================================ */
window.openTab = (tab) => {
  document.querySelectorAll('.tab-page').forEach(s => s.classList.add('hidden'));
  $('sec-' + tab)?.classList.remove('hidden');

  document.querySelectorAll('.nav-side, .nav-bottom').forEach(b => {
    b.classList.remove('bg-black','dark:bg-white','text-white','dark:text-black','text-black','dark:text-white');
    b.classList.add('text-neutral-500');
  });
  document.querySelectorAll(`[data-tab="${tab}"], [data-mtab="${tab}"]`).forEach(b => {
    b.classList.remove('text-neutral-500');
    b.classList.add('bg-black','dark:bg-white','text-white','dark:text-black','text-black','dark:text-white');
  });
};

/* ============================================================
   10) Feed (Realtime)
   ============================================================ */
function startFeed() {
  const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(50));
  const unsub = onSnapshot(q, (snap) => {
    const list = $('feed-list');
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = `<div class="text-xs text-neutral-500 text-center p-6 border border-neutral-300 dark:border-neutral-800 rounded-3xl">لا توجد منشورات بعد.</div>`;
      return;
    }
    snap.forEach(d => {
      const p = d.data();
      const el = document.createElement('div');
      el.className = 'bg-white dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-800 rounded-3xl p-4 space-y-3';
      const img = p.imageURL ? `<img src="${esc(p.imageURL)}" class="rounded-2xl max-h-80 object-cover w-full" alt="">` : '';
      const isMine = p.authorId === me.uid;
      el.innerHTML = `
        <div class="flex items-center justify-between text-xs">
          <span class="font-black">${esc(p.authorName)} <span class="text-[10px] font-mono text-neutral-500">${esc(p.authorYxa || '')}</span></span>
          <span class="text-[10px] text-neutral-500">${p.createdAt?.toDate ? p.createdAt.toDate().toLocaleString('ar-SA') : 'الآن'}</span>
        </div>
        ${p.text ? `<p class="text-sm leading-relaxed break-words whitespace-pre-wrap">${esc(p.text)}</p>` : ''}
        ${img}
        <div class="flex items-center gap-3 pt-2 border-t border-neutral-200 dark:border-neutral-800 text-xs">
          <button data-like="${d.id}" class="btn-act font-bold text-neutral-500 hover:text-rose-500"><i class="fa-solid fa-heart ml-1"></i> ${(p.likes||[]).length}</button>
          ${isMine ? `<button data-del="${d.id}" class="btn-act font-bold text-neutral-400 hover:text-rose-500 text-[11px]"><i class="fa-solid fa-trash ml-1"></i>حذف</button>` : ''}
        </div>`;
      el.querySelector(`[data-like="${d.id}"]`).onclick = () => toggleLike(d.id, p.likes || []);
      if (isMine) el.querySelector(`[data-del="${d.id}"]`).onclick = () => deletePost(d.id, p.imagePath);
      list.appendChild(el);
    });
  }, (err) => {
    console.error(err);
    toast('تعذر تحميل المنشورات', 'error');
  });
  unsubs.push(unsub);
}

window.publishPost = async () => {
  const txt = $('post-text').value.trim();
  const file = $('post-image').files[0];
  if (!txt && !file) { toast('اكتب نصاً أو اختر صورة', 'error'); return; }
  const btn = $('btn-publish');
  busy(btn, true);
  try {
    let imageURL = '', imagePath = '';
    if (file) {
      if (file.size > 10*1024*1024) throw new Error('الصورة أكبر من 10MB');
      if (!file.type.startsWith('image/')) throw new Error('الملف ليس صورة');
      imagePath = `posts/${me.uid}/${Date.now()}_${file.name}`;
      const ref = sRef(storage, imagePath);
      await uploadBytes(ref, file);
      imageURL = await getDownloadURL(ref);
    }
    await addDoc(collection(db, 'posts'), {
      authorId: me.uid,
      authorName: me.name,
      authorYxa: me.yxaId,
      text: txt,
      imageURL, imagePath,
      likes: [],
      createdAt: serverTimestamp()
    });
    $('post-text').value = '';
    $('post-image').value = '';
    $('post-image-name').textContent = '';
    toast('تم النشر');
  } catch (err) {
    toast(err.message || 'فشل النشر', 'error');
  } finally {
    busy(btn, false);
  }
};

window.toggleLike = async (postId, likes) => {
  const has = likes.includes(me.uid);
  const newLikes = has ? likes.filter(x => x !== me.uid) : [...likes, me.uid];
  try {
    await updateDoc(doc(db, 'posts', postId), { likes: newLikes });
  } catch (err) { toast('فشل التفاعل', 'error'); }
};

window.deletePost = async (postId, imagePath) => {
  if (!confirm('حذف المنشور؟')) return;
  try {
    await deleteDoc(doc(db, 'posts', postId));
    if (imagePath) { try { await deleteObject(sRef(storage, imagePath)); } catch(_){} }
    toast('تم الحذف', 'info');
  } catch (err) { toast('فشل الحذف', 'error'); }
};

$('post-image').addEventListener('change', (e) => {
  const f = e.target.files[0];
  $('post-image-name').textContent = f ? `${f.name} (${(f.size/1024).toFixed(0)} KB)` : '';
});

/* ============================================================
   11) Chat
   ============================================================ */
async function startConversations() {
  const q = query(
    collection(db, 'chats'),
    where('members', 'array-contains', me.uid)
  );
  const unsub = onSnapshot(q, async (snap) => {
    const list = $('conversations-list');
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = `<div class="text-xs text-neutral-500 text-center p-6 border border-neutral-300 dark:border-neutral-800 rounded-3xl">لا توجد محادثات. أضف صديقاً بالبريد أعلاه.</div>`;
      return;
    }
    for (const d of snap.docs) {
      const c = d.data();
      const otherId = c.members.find(x => x !== me.uid);
      let otherName = otherId;
      try {
        const u = await getDoc(doc(db, 'users', otherId));
        if (u.exists()) otherName = u.data().name + ' (' + u.data().yxaId + ')';
      } catch (_) {}
      const row = document.createElement('button');
      row.className = 'btn-act w-full text-right p-4 rounded-2xl bg-white dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-800 flex items-center justify-between';
      row.innerHTML = `
        <span class="text-xs font-black">${esc(otherName)}</span>
        <i class="fa-solid fa-comments text-neutral-400"></i>`;
      row.onclick = () => openChat(d.id, otherName);
      list.appendChild(row);
    }
  }, (err) => {
    console.error(err);
    toast('تعذر تحميل المحادثات', 'error');
  });
  unsubs.push(unsub);
}

window.addFriend = async () => {
  const email = $('friend-email').value.trim();
  if (!email) { toast('أدخل بريد الصديق', 'error'); return; }
  if (email === me.email) { toast('لا يمكن إضافة نفسك', 'error'); return; }
  try {
    const q = query(collection(db, 'users'), where('email', '==', email), limit(1));
    const snap = await getDocs(q);
    if (snap.empty) { toast('لا يوجد مستخدم بهذا البريد', 'error'); return; }
    const otherId = snap.docs[0].id;
    // ابحث عن محادثة موجودة
    const qc = query(
      collection(db, 'chats'),
      where('members', 'array-contains', me.uid)
    );
    const csnap = await getDocs(qc);
    for (const c of csnap.docs) {
      if (c.data().members.includes(otherId)) {
        toast('المحادثة موجودة بالفعل', 'info');
        openChat(c.id, snap.docs[0].data().name);
        return;
      }
    }
    // أنشئ محادثة جديدة
    await addDoc(collection(db, 'chats'), {
      members: [me.uid, otherId],
      createdAt: serverTimestamp(),
      lastMessage: ''
    });
    $('friend-email').value = '';
    toast('تمت إضافة الصديق');
  } catch (err) {
    console.error(err);
    toast('فشل الإضافة', 'error');
  }
};

window.openChat = (chatId, title) => {
  currentChat = chatId;
  $('chat-title').textContent = title;
  $('chat-messages').innerHTML = '<p class="text-xs text-neutral-500">جاري التحميل...</p>';
  $('chat-modal').classList.remove('hidden');

  if (chatUnsub) { try { chatUnsub(); } catch(_){} }
  const q = query(
    collection(db, 'chats', chatId, 'messages'),
    orderBy('createdAt', 'asc'),
    limit(200)
  );
  chatUnsub = onSnapshot(q, (snap) => {
    const box = $('chat-messages');
    box.innerHTML = '';
    if (snap.empty) {
      box.innerHTML = '<p class="text-xs text-neutral-500 text-center">لا توجد رسائل بعد.</p>';
      return;
    }
    snap.forEach(d => {
      const m = d.data();
      const div = document.createElement('div');
      div.className = m.senderId === me.uid ? 'msg-me' : 'msg-other';
      div.textContent = m.text;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }, (err) => {
    console.error(err);
    toast('تعذر تحميل الرسائل', 'error');
  });
};

window.closeChat = () => {
  $('chat-modal').classList.add('hidden');
  if (chatUnsub) { try { chatUnsub(); } catch(_){} chatUnsub = null; }
  currentChat = null;
};

window.sendChatMsg = async () => {
  if (!currentChat) return;
  const txt = $('chat-input').value.trim();
  if (!txt) return;
  if (txt.length > 2000) { toast('الرسالة طويلة جداً', 'error'); return; }
  try {
    await addDoc(collection(db, 'chats', currentChat, 'messages'), {
      senderId: me.uid,
      text: txt,
      createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, 'chats', currentChat), { lastMessage: txt });
    $('chat-input').value = '';
  } catch (err) {
    toast('فشل الإرسال', 'error');
  }
};

/* ============================================================
   12) AI (Gemini)
   ============================================================ */
window.sendAi = async () => {
  if (aiBusy) return;
  const txt = $('ai-input').value.trim();
  if (!txt) return;
  const key = localStorage.getItem('yxa_gemini_key');
  if (!key) { toast('أضف مفتاح Gemini أولاً في الإعدادات', 'error'); return; }

  aiBusy = true;
  busy($('btn-ai'), true);
  const feed = $('ai-feed');
  const q = document.createElement('div');
  q.className = 'msg-me';
  q.textContent = txt;
  feed.appendChild(q);
  $('ai-input').value = '';
  feed.scrollTop = feed.scrollHeight;

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: txt }] }] })
      }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const out = data?.candidates?.[0]?.content?.parts?.[0]?.text || '(رد فارغ)';
    const a = document.createElement('div');
    a.className = 'msg-other whitespace-pre-wrap';
    a.textContent = out;
    feed.appendChild(a);
  } catch (err) {
    const a = document.createElement('div');
    a.className = 'msg-other';
    a.textContent = 'تعذر الاتصال بـ Gemini. تحقق من المفتاح.';
    feed.appendChild(a);
  } finally {
    aiBusy = false;
    busy($('btn-ai'), false);
    feed.scrollTop = feed.scrollHeight;
  }
};

// اربط مفتاح Gemini من الحساب
window.saveGeminiKey = () => {
  const k = prompt('أدخل مفتاح Gemini API:');
  if (k !== null) {
    localStorage.setItem('yxa_gemini_key', k.trim());
    toast('تم حفظ المفتاح');
  }
};

/* ============================================================
   13) Cloud Files
   ============================================================ */
function startFiles() {
  const q = query(
    collection(db, 'files'),
    where('ownerId', '==', me.uid),
    orderBy('createdAt', 'desc')
  );
  const unsub = onSnapshot(q, (snap) => {
    const list = $('files-list');
    list.innerHTML = '';
    if (snap.empty) {
      list.innerHTML = `<div class="text-xs text-neutral-500 text-center p-6 border border-neutral-300 dark:border-neutral-800 rounded-3xl">لا توجد ملفات.</div>`;
      return;
    }
    snap.forEach(d => {
      const f = d.data();
      const row = document.createElement('div');
      row.className = 'p-3 rounded-2xl bg-white dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-800 flex items-center justify-between gap-2';
      row.innerHTML = `
        <div class="min-w-0">
          <p class="text-xs font-black truncate">${esc(f.name)}</p>
          <p class="text-[10px] text-neutral-500">${(f.size/1024).toFixed(1)} KB</p>
        </div>
        <div class="flex gap-1 shrink-0">
          <a href="${esc(f.url)}" target="_blank" rel="noopener" class="btn-act p-2 rounded-xl bg-neutral-200 dark:bg-neutral-800 text-xs"><i class="fa-solid fa-download"></i></a>
          <button data-del="${d.id}" data-path="${esc(f.path)}" class="btn-act p-2 rounded-xl text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button>
        </div>`;
      row.querySelector(`[data-del="${d.id}"]`).onclick = () => delFile(d.id, f.path);
      list.appendChild(row);
    });
  });
  unsubs.push(unsub);
}

window.uploadFiles = async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  for (const f of files) {
    if (f.size > 50*1024*1024) { toast(`${f.name}: أكبر من 50MB`, 'error'); continue; }
    try {
      const path = `cloud/${me.uid}/${Date.now()}_${f.name}`;
      const ref = sRef(storage, path);
      await uploadBytes(ref, f);
      const url = await getDownloadURL(ref);
      await addDoc(collection(db, 'files'), {
        ownerId: me.uid,
        name: f.name,
        size: f.size,
        path, url,
        createdAt: serverTimestamp()
      });
      toast(`تم رفع ${f.name}`);
    } catch (err) {
      toast(`فشل رفع ${f.name}`, 'error');
    }
  }
  e.target.value = '';
};

async function delFile(id, path) {
  if (!confirm('حذف الملف؟')) return;
  try {
    await deleteDoc(doc(db, 'files', id));
    try { await deleteObject(sRef(storage, path)); } catch (_) {}
    toast('تم الحذف', 'info');
  } catch (err) { toast('فشل الحذف', 'error'); }
}

/* ============================================================
   14) Account
   ============================================================ */
window.saveProfile = async () => {
  const name  = $('acc-name').value.trim();
  const phone = $('acc-phone').value.trim();
  if (name.length < 2) { toast('الاسم قصير', 'error'); return; }
  if (phone && !/^0?5\d{8}$/.test(phone)) { toast('رقم جوال غير صالح', 'error'); return; }
  try {
    await updateDoc(doc(db, 'users', me.uid), { name, phone });
    await updateProfile(auth.currentUser, { displayName: name });
    me.name = name; me.phone = phone;
    $('badge-name').textContent = name;
    toast('تم الحفظ');
  } catch (err) {
    toast('فشل الحفظ', 'error');
  }
};

/* ============================================================
   15) Escape
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeChat();
});
</script>
